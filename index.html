<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightSteps — ก้าวเล็ก ๆ เรียนรู้ทุกวัน</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Mitr', sans-serif;
            background-color: #E0F7FA;
            color: #004D40;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .app-container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
            text-align: center;
            border: 5px solid #80DEEA;
            margin-top: 10px;
        }
        .header-icon { font-size: 50px; color: #FFB300; margin-bottom: 10px; }
        h1 { font-family: 'Fredoka One', 'Mitr', sans-serif; font-size: 32px; color: #00796B; }
        .subtitle { font-size: 14px; color: #009688; margin-bottom: 25px; }
        
        .status-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .score-board, .timer-board {
            padding: 12px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border: 2px dashed;
        }
        .score-board { background-color: #FFF9C4; border-color: #FBC02D; }
        .timer-board { background-color: #FFEBEE; border-color: #FF8A80; color: #C62828; }
        .timer-danger { background-color: #FFCDD2 !important; animation: blink 0.5s infinite; }

        .mode-selection {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .mode-btn {
            padding: 10px 5px;
            font-size: 16px;
            font-weight: bold;
            border: 3px solid #E0E0E0;
            border-radius: 12px;
            background-color: #F5F5F5;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background-color: #009688;
            color: white;
            border-color: #00796B;
            box-shadow: 0 4px 0 #004D40;
            transform: translateY(-2px);
        }

        .game-box {
            background-color: #F5F5F5;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 3px solid #E0E0E0;
        }
        .question-text {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        
        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .choice-btn {
            background-color: #2979FF;
            color: white;
            border: none;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 0 #1565C0;
            transition: all 0.1s;
        }
        .choice-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1565C0; }
        
        .shop-banner {
            background-color: #FF9100;
            color: white;
            padding: 15px;
            border-radius: 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 0 #EF6C00;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .shop-banner:active { transform: translateY(4px); box-shadow: 0 1px 0 #EF6C00; }

        @keyframes blink { 50% { opacity: 0.7; } }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header-icon">🌟</div>
        <h1>BrightSteps</h1>
        <div class="subtitle">เป้าหมายชนะ: 150 คะแนน 🏆</div>

        <div class="status-bar">
            <div class="score-board">
                <i class="fa-solid fa-trophy" style="color: #FBC02D;"></i>
                <span>ดาวของหนู: <span id="score-text">0</span> / 150</span>
            </div>
            <div class="timer-board" id="timer-box">
                <i class="fa-solid fa-clock"></i>
                <span>เวลา: <span id="time-left">10.0</span> วิ</span>
            </div>
        </div>

        <div class="mode-selection">
            <button class="mode-btn active" id="btn-add" onclick="changeMode('add')">➕ บวก</button>
            <button class="mode-btn" id="btn-sub" onclick="changeMode('sub')">➖ ลบ</button>
            <button class="mode-btn" id="btn-mul" onclick="changeMode('mul')">✖️ คูณ</button>
            <button class="mode-btn" id="btn-div" onclick="changeMode('div')">➗ หาร</button>
        </div>

        <div class="game-box">
            <div class="question-text" id="question-display">กำลังเตรียมด่านสปีดรัน...</div>
            <div class="choice-grid">
                <button class="choice-btn" onclick="checkAnswer(0)" id="c0">?</button>
                <button class="choice-btn" onclick="checkAnswer(1)" id="c1">?</button>
                <button class="choice-btn" onclick="checkAnswer(2)" id="c2">?</button>
                <button class="choice-btn" onclick="checkAnswer(3)" id="c3">?</button>
            </div>
        </div>

        <button class="shop-banner" onclick="openShop()">
            <i class="fa-solid fa-file-pdf"></i> ดาวน์โหลดชุดใบงานสปีดรันฝึกฝน (เริ่มต้น 39 บาท)
        </button>
    </div>

    <script>
        let score = 0;
        let currentCorrectAnswer = 0;
        let timeLeft = 10;
        let maxTimeForQuestion = 10; // เวลาตั้งต้นเต็มข้อ (จะค่อยๆ ลดลงเมื่อคะแนนเพิ่มขึ้น)
        let timerInterval;
        let currentMode = 'add';

        function startTimer() {
            clearInterval(timerInterval);
            
            // 🆕 คำนวณเวลาเริ่มต้นของข้อนี้ให้เร็วขึ้นตามคะแนน (ทุกๆ 10 คะแนน เวลาจะลดลง 0.5 วินาที)
            // ตัวอย่าง: คะแนน 0 = ให้เวลา 10 วิ, คะแนน 100 = จะเหลือเวลาให้คิดแค่ 5 วิ!
            maxTimeForQuestion = 10 - (score / 20); 
            if (maxTimeForQuestion < 2.5) maxTimeForQuestion = 2.5; // ล็อกไม่ให้เร็วจนเกินมนุษย์ (ขั้นต่ำเหลือข้อละ 2.5 วิ)
            
            timeLeft = maxTimeForQuestion;
            document.getElementById('time-left').innerText = timeLeft.toFixed(1);
            document.getElementById('timer-box').classList.remove('timer-danger');

            // ใช้การนับถอยหลังละเอียดขึ้นทีละ 0.1 วินาที เพื่อความสมูทและตื่นเต้น
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft < 0) timeLeft = 0;
                
                document.getElementById('time-left').innerText = timeLeft.toFixed(1);

                if (timeLeft <= 3.0) {
                    document.getElementById('timer-box').classList.add('timer-danger');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("⏰ แสงเธอเร็วได้กว่านี้ ไอ่ตูด");
                    generateQuestion();
                }
            }, 100);
        }

        function changeMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            if(mode === 'add') document.getElementById('btn-add').classList.add('active');
            if(mode === 'sub') document.getElementById('btn-sub').classList.add('active');
            if(mode === 'mul') document.getElementById('btn-mul').classList.add('active');
            if(mode === 'div') document.getElementById('btn-div').classList.add('active');
            generateQuestion();
        }

        function generateQuestion() {
            let num1, num2, correctAnswer, questionSign;

            if (currentMode === 'add') {
                num1 = Math.floor(Math.random() * 15) + 1; 
                num2 = Math.floor(Math.random() * 15) + 1;
                correctAnswer = num1 + num2;
                questionSign = '+';
            } else if (currentMode === 'sub') {
                num1 = Math.floor(Math.random() * 15) + 5; 
                num2 = Math.floor(Math.random() * num1);
                correctAnswer = num1 - num2;
                questionSign = '-';
            } else if (currentMode === 'mul') {
                num1 = Math.floor(Math.random() * 8) + 2; 
                num2 = Math.floor(Math.random() * 9) + 1;
                correctAnswer = num1 * num2;
                questionSign = '×';
            } else if (currentMode === 'div') {
                num2 = Math.floor(Math.random() * 5) + 2; 
                correctAnswer = Math.floor(Math.random() * 5) + 1; 
                num1 = num2 * correctAnswer; 
                questionSign = '÷';
            }

            currentCorrectAnswer = correctAnswer;
            document.getElementById('question-display').innerText = `${num1} ${questionSign} ${num2} = เท่าไหร่นะ?`;

            let choices = [correctAnswer];
            while(choices.length < 4) {
