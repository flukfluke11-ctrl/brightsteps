<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightSteps — ก้าวเล็ก ๆ เรียนรู้ทุกวัน</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Mitr', sans-serif;
            background-color: #E0F7FA;
            color: #004D40;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .app-container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
            text-align: center;
            border: 5px solid #80DEEA;
            margin-top: 10px;
            position: relative;
        }
        .header-icon { font-size: 50px; color: #FFB300; margin-bottom: 10px; }
        h1 { font-family: 'Fredoka One', 'Mitr', sans-serif; font-size: 32px; color: #00796B; }
        .subtitle { font-size: 14px; color: #009688; margin-bottom: 25px; }
        
        .status-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .score-board, .timer-board {
            padding: 12px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border: 2px dashed;
        }
        .score-board { background-color: #FFF9C4; border-color: #FBC02D; }
        .timer-board { background-color: #FFEBEE; border-color: #FF8A80; color: #C62828; }
        .timer-danger { background-color: #FFCDD2 !important; animation: blink 0.5s infinite; }

        .mode-selection {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .mode-btn {
            padding: 10px 5px;
            font-size: 16px;
            font-weight: bold;
            border: 3px solid #E0E0E0;
            border-radius: 12px;
            background-color: #F5F5F5;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background-color: #009688;
            color: white;
            border-color: #00796B;
            box-shadow: 0 4px 0 #004D40;
            transform: translateY(-2px);
        }

        .game-box {
            background-color: #F5F5F5;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 3px solid #E0E0E0;
        }
        .question-text {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        
        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .choice-btn {
            background-color: #2979FF;
            color: white;
            border: none;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 0 #1565C0;
            transition: all 0.1s;
        }
        .choice-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1565C0; }
        
        .shop-banner {
            background-color: #FF9100;
            color: white;
            padding: 15px;
            border-radius: 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 0 #EF6C00;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .shop-banner:active { transform: translateY(4px); box-shadow: 0 1px 0 #EF6C00; }

        /* 🆕 ดีไซน์กล่องป๊อปอัปแจ้งเตือนแทนระบบเก่า (Custom Dialog Pop-up) */
        .custom-alert-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }
        .custom-alert-box {
            background: white;
            border-radius: 24px;
            padding: 25px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 4px solid #80DEEA;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .alert-title { font-size: 24px; font-weight: bold; margin-bottom: 15px; }
        .alert-btn {
            background-color: #009688;
            color: white; border: none;
            padding: 12px 30px; font-size: 18px; font-weight: bold;
            border-radius: 12px; cursor: pointer; margin-top: 15px;
            box-shadow: 0 4px 0 #004D40;
        }
        .alert-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #004D40; }

        @keyframes blink { 50% { opacity: 0.7; } }
    </style>
</head>
<body>

    <!-- 🆕 หน้าต่างแจ้งเตือนฝังในเว็บที่จะใช้แสดงข้อความและคำแซว -->
    <div id="custom-alert" class="custom-alert-overlay">
        <div class="custom-alert-box">
            <div class="alert-title" id="alert-msg">ข้อความแจงเตือน</div>
            <button class="alert-btn" onclick="closeCustomAlert()">สู้ต่อไป! 🚀</button>
        </div>
    </div>

    <div class="app-container">
        <div class="header-icon">🌟</div>
        <h1>BrightSteps</h1>
        <div class="subtitle">เป้าหมายชนะ: 150 คะแนน 🏆</div>

        <div class="status-bar">
            <div class="score-board">
                <i class="fa-solid fa-trophy" style="color: #FBC02D;"></i>
                <span>ดาวของหนู: <span id="score-text">0</span> / 150</span>
            </div>
            <div class="timer-board" id="timer-box">
                <i class="fa-solid fa-clock"></i>
                <span>เวลา: <span id="time-left">10.0</span> วิ</span>
            </div>
        </div>

        <div class="mode-selection">
            <button class="mode-btn active" id="btn-add" onclick="changeMode('add')">➕ บวก</button>
            <button class="mode-btn" id="btn-sub" onclick="changeMode('sub')">➖ ลบ</button>
            <button class="mode-btn" id="btn-mul" onclick="changeMode('mul')">✖️ คูณ</button>
            <button class="mode-btn" id="btn-div" onclick="changeMode('div')">➗ หาร</button>
        </div>

        <div class="game-box">
            <div class="question-text" id="question-display">กำลังเตรียมด่านสปีดรัน...</div>
            <div class="choice-grid">
                <button class="choice-btn" onclick="checkAnswer(0)" id="c0">?</button>
                <button class="choice-btn" onclick="checkAnswer(1)" id="c1">?</button>
                <button class="choice-btn" onclick="checkAnswer(2)" id="c2">?</button>
                <button class="choice-btn" onclick="checkAnswer(3)" id="c3">?</button>
            </div>
        </div>

        <button class="shop-banner" onclick="showShopInfo()">
            <i class="fa-solid fa-file-pdf"></i> ดาวน์โหลดชุดใบงานสปีดรันฝึกฝน (เริ่มต้น 39 บาท)
        </button>
    </div>

    <script>
        let score = 0;
        let currentCorrectAnswer = 0;
        let timeLeft = 10;
        let maxTimeForQuestion = 10; 
        let timerInterval;
        let currentMode = 'add';
        let isAlertOpen = false; // ตัวเช็คป้องกันระบบนับเวลาทำงานซ้อนตอนป๊อปอัปเปิด

        function startTimer() {
            clearInterval(timerInterval);
            if (isAlertOpen) return; // หากหน้าต่างแจ้งเตือนเปิดอยู่ ไม่ต้องเริ่มนับถอยหลัง

            maxTimeForQuestion = 10 - (score / 20); 
            if (maxTimeForQuestion < 2.5) maxTimeForQuestion = 2.5; 
            
            timeLeft = maxTimeForQuestion;
            document.getElementById('time-left').innerText = timeLeft.toFixed(1);
            document.getElementById('timer-box').classList.remove('timer-danger');

            timerInterval = setInterval(() => {
                if (isAlertOpen) return;
                timeLeft -= 0.1;
                if (timeLeft < 0) timeLeft = 0;
                
                document.getElementById('time-left').innerText = timeLeft.toFixed(1);

                if (timeLeft <= 3.0) {
                    document.getElementById('timer-box').classList.add('timer-danger');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    // 🆕 สั่งโชว์คำแซวสุดกวนผ่านระบบป๊อปอัปนุ่มนวลตัวใหม่
                    showCustomAlert("⏰ แสงเธอเร็วได้กว่านี้ ไอ่ตูด");
                }
            }, 100);
        }

        // ฟังก์ชันสั่งเปิดกล่องข้อความแจ้งเตือนฝังในหน้าเว็บ
        function showCustomAlert(msg) {
            isAlertOpen = true;
            clearInterval(timerInterval);
            document.getElementById('alert-msg').innerText = msg;
            document.getElementById('custom-alert').style.display = 'flex';
        }

        // ฟังก์ชันกดปิดกล่องข้อความเพื่อขึ้นโจทย์ข้อถัดไป
        function closeCustomAlert() {
            document.getElementById('custom-alert').style.display = 'none';
            isAlertOpen = false;
            generateQuestion(); // สุ่มข้อถัดไปทันที
        }

        function showShopInfo() {
