<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightSteps — ก้าวเล็ก ๆ เรียนรู้ทุกวัน</title>
    <!-- นำเข้าฟอนต์น่ารักๆ เหมาะสำหรับเด็ก และไอคอนสวยๆ -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Mitr', sans-serif;
            background-color: #E0F7FA; /* สีฟ้าพาสเทลสดใสสำหรับเด็ก */
            color: #004D40;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .app-container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
            text-align: center;
            border: 5px solid #80DEEA;
            margin-top: 10px;
        }
        .header-icon {
            font-size: 50px;
            color: #FFB300;
            margin-bottom: 10px;
        }
        h1 { font-family: 'Fredoka One', 'Mitr', sans-serif; font-size: 32px; color: #00796B; }
        .subtitle { font-size: 14px; color: #009688; margin-bottom: 25px; }
        
        /* โซนแสดงคะแนนสะสม */
        .score-board {
            background-color: #FFF9C4;
            padding: 10px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 2px dashed #FBC02D;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        /* โซนกล่องคำถามเกม */
        .game-box {
            background-color: #F5F5F5;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 3px solid #E0E0E0;
        }
        .question-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        
        /* ปุ่มตัวเลือกคำตอบ (ช้อยส์) */
        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .choice-btn {
            background-color: #2979FF;
            color: white;
            border: none;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 0 #1565C0;
            transition: all 0.1s;
        }
        .choice-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1565C0;
        }
        
        /* ปุ่มโซนสร้างรายได้ (ขายใบงาน PDF) */
        .shop-banner {
            background-color: #FF9100;
            color: white;
            padding: 15px;
            border-radius: 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 0 #EF6C00;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .shop-banner:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #EF6C00;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ส่วนหัวข้อแอป -->
        <div class="header-icon"><i class="fa-solid fa-star-twinkle"></i>🌟</div>
        <h1>BrightSteps</h1>
        <div class="subtitle">ก้าวเล็ก ๆ เรียนรู้ทุกวัน 🚀</div>

        <!-- กระดานคะแนนสำหรับเด็ก -->
        <div class="score-board">
            <i class="fa-solid fa-trophy" style="color: #FBC02D;"></i>
            <span>คะแนนของหนู: <span id="score-text">0</span> คะแนน</span>
        </div>

        <!-- กล่องเกมคณิตศาสตร์ ป.1-3 -->
        <div class="game-box">
            <div class="question-text" id="question-display">กำลังโหลดโจทย์แสนสนุก...</div>
            <div class="choice-grid">
                <button class="choice-btn" onclick="checkAnswer(0)" id="c0">?</button>
                <button class="choice-btn" onclick="checkAnswer(1)" id="c1">?</button>
                <button class="choice-btn" onclick="checkAnswer(2)" id="c2">?</button>
                <button class="choice-btn" onclick="checkAnswer(3)" id="c3">?</button>
            </div>
        </div>

        <!-- ปุ่มสำหรับขายใบงานสร้างรายได้ตามแผนธุรกิจ -->
        <button class="shop-banner" onclick="openShop()">
            <i class="fa-solid fa-file-pdf"></i> ดาวน์โหลดใบงานฝึกฝนต่อ (เริ่มต้น 99 บาท)
        </button>
    </div>

    <!-- ส่วนตรรกะ AI และการควบคุมเกม (JavaScript) -->
    <script>
        let score = 0;
        let currentCorrectAnswer = 0;

        // ฟังก์ชันสุ่มโจทย์คณิตศาสตร์ ป.1-ป.2 แบบอัตโนมัติไม่รู้จบ
        function generateQuestion() {
            // สุ่มตัวเลขสองตัวมาบวกกัน (เหมาะสำหรับระดับเริ่มต้น)
            let num1 = Math.floor(Math.random() * 15) + 1; 
            let num2 = Math.floor(Math.random() * 15) + 1;
            let correctAnswer = num1 + num2;
            currentCorrectAnswer = correctAnswer;

            // แสดงโจทย์บนหน้าจอ
            document.getElementById('question-display').innerText = `${num1} + ${num2} = เท่ากับเท่าไหร่นะ?`;

            // สร้างช้อยส์หลอก 3 ตัว + ช้อยส์ถูก 1 ตัว
            let choices = [correctAnswer];
            while(choices.length < 4) {
                let wrongAnswer = correctAnswer + (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 1 : -1);
                if(wrongAnswer > 0 && !choices.includes(wrongAnswer)) {
                    choices.push(wrongAnswer);
                }
            }

            // สลับตำแหน่งช้อยส์ไม่ให้คำตอบถูกอยู่ที่เดิม
            choices.sort(() => Math.random() - 0.5);

            // นำคำตอบไปใส่ในปุ่มกดทั้ง 4 ปุ่ม
            for(let i = 0; i < 4; i++) {
                document.getElementById(`c${i}`).innerText = choices[i];
            }
        }

        // ฟังก์ชันตรวจคำตอบเมื่อเด็กกดปุ่มช้อยส์
        function checkAnswer(buttonIndex) {
            let selectedAnswer = parseInt(document.getElementById(`c${buttonIndex}`).innerText);
            
            if(selectedAnswer === currentCorrectAnswer) {
                alert("🎉 เก่งมากเลยครับ! ตอบถูกรับไป 10 คะแนน 🌟");
                score += 10;
                document.getElementById('score-text').innerText = score;
            } else {
                alert("😢 ลองใหม่อีกทีนะคนเก่ง! คำตอบที่ถูกคือ " + currentCorrectAnswer);
            }
            
            // สุ่มโจทย์ข้อถัดไปทันที
            generateQuestion();
        }

        // ฟังก์ชันแสดงกล่องขายสินค้า (Monetization)
        function openShop() {
            alert("📚 ระบบร้านค้า BrightSteps\n\n• แพ็กเกจใบงานฝึกฝน ป.1 - ป.3 ราคา 99 บาท\n• แพ็กเกจสื่อการสอนสำหรับคุณครู ราคา 299 บาท\n\n(ต้นแบบตัวอย่าง: ในอนาคตจุดนี้จะลิงก์ไปยังหน้าร้านค้าหรือช่องทางชำระเงินของคุณครับ)");
        }

        // เริ่มเกมทันทีที่เปิดหน้าเว็บ
        generateQuestion();
    </script>
</body>
</html>
